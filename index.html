<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Agent Docker</title>
    <style>
        body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; display: flex; justify-content: center; padding-top: 50px; }
        .chat-box { width: 400px; background: #313244; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { text-align: center; font-size: 20px; color: #89b4fa; }
        textarea { width: 100%; height: 80px; margin-bottom: 10px; padding: 10px; background: #1e1e2e; color: white; border: 1px solid #45475a; border-radius: 5px; resize: none; }
        button { width: 100%; padding: 10px; background: #a6e3a1; color: #11111b; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #94e2d5; }
        #reponse { margin-top: 15px; padding: 10px; background: #1e1e2e; border-left: 4px solid #f9e2af; min-height: 50px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="chat-box">
        <h1>🤖 Mon Agent IA (Docker)</h1>
        <textarea id="question" placeholder="Posez votre question ici..."></textarea>
        <button onclick="poserQuestion()">Envoyer à l'Agent</button>
        <div id="reponse">La réponse de l'agent s'affichera ici...</div>
    </div>

    <script>
        async function poserQuestion() {
            const question = document.getElementById('question').value;
            const divReponse = document.getElementById('reponse');
            divReponse.innerText = "⏳ L'agent réfléchit...";
            
            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();
                divReponse.innerText = data.reponse;
            } catch (error) {
                divReponse.innerText = "Erreur de connexion à l'agent.";
            }
        }
    </script>
</body>
</html>
